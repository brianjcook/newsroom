name: Deploy Public Fixes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - web/lib/**
      - web/public/**
      - worker/newsroom/**
      - tests/**
      - tests/db-read-retry.php
      - .github/workflows/deploy-public-fixes.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: newsroom_test_password
          MYSQL_DATABASE: newsroom_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pnewsroom_test_password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NEWSROOM_DB_HOST: 127.0.0.1
      NEWSROOM_DB_PORT: 3306
      NEWSROOM_DB_NAME: newsroom_test
      NEWSROOM_DB_USER: root
      NEWSROOM_DB_PASSWORD: newsroom_test_password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check publication protections
        run: |
          find web -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/db-read-retry.php
          php tests/homepage-refresh.php
          python3 -m pip install PyMySQL==1.0.2
          python3 -m unittest discover -s tests -p 'test_publication.py'
          php tests/publication-review.php
          python3 tests/publication-http.py
          python3 tests/publication-sql.py
          php tests/publication-public.php

      - name: Upload changed files via FTPS
        env:
          FTP_HOST: ${{ secrets.FREEHOSTIA_FTP_HOST }}
          FTP_USER: ${{ secrets.FREEHOSTIA_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FREEHOSTIA_FTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.FREEHOSTIA_FTP_REMOTE_PATH }}
        run: |
          set -euo pipefail

          : "${FTP_HOST:?Missing FREEHOSTIA_FTP_HOST}"
          : "${FTP_USER:?Missing FREEHOSTIA_FTP_USER}"
          : "${FTP_PASSWORD:?Missing FREEHOSTIA_FTP_PASSWORD}"

          remote_path="${FTP_REMOTE_PATH:-/}"

          sudo apt-get update
          sudo apt-get install -y lftp

          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          cd $remote_path

          set cmd:fail-exit no
          mkdir lib
          mkdir assets
          mkdir web
          mkdir web/lib
          mkdir web/public
          mkdir web/public/assets
          mkdir worker
          mkdir worker/newsroom
          mkdir db
          mkdir db/migrations
          set cmd:fail-exit yes

          put -O lib web/lib/publication.php
          put -O web/lib web/lib/publication.php
          put -O lib web/lib/db.php
          put -O web/lib web/lib/db.php
          put -O lib web/lib/content.php
          put -O web/lib web/lib/content.php
          put -O . web/public/editorial-reviews.php
          put -O web/public web/public/editorial-reviews.php
          put -O . web/public/editorial.php
          put -O web/public web/public/editorial.php
          put -O . web/public/editorial-opinion-edit.php
          put -O web/public web/public/editorial-opinion-edit.php
          put -O . web/public/.htaccess
          put -O web/public web/public/.htaccess
          put -O . web/public/story.php
          put -O web/public web/public/story.php
          put -O . web/public/status.php
          put -O web/public web/public/status.php
          put -O . web/public/calendar.php
          put -O web/public web/public/calendar.php
          put -O assets web/public/assets/styles.css
          put -O web/public/assets web/public/assets/styles.css
          put -O worker/newsroom worker/newsroom/publication.py
          put -O worker/newsroom worker/newsroom/db.py
          put -O worker/newsroom worker/newsroom/context.py
          put -O worker/newsroom worker/newsroom/pipeline.py
          put -O worker/newsroom worker/newsroom/publish.py
          put -O worker/newsroom worker/newsroom/sources.py
          put -O db/migrations db/migrations/013_automated_context_layer.sql
          put -O db/migrations db/migrations/014_wareham_media_context_source.sql
          put -O db/migrations db/migrations/015_publication_reviews.sql
          get lib/publication.php -o /tmp/newsroom-deployed-publication.php
          get editorial-reviews.php -o /tmp/newsroom-deployed-reviews.php
          get lib/db.php -o /tmp/newsroom-deployed-db.php
          get lib/content.php -o /tmp/newsroom-deployed-content.php
          get index.php -o /tmp/newsroom-deployed-index.php
          bye
          EOF
          cmp web/lib/publication.php /tmp/newsroom-deployed-publication.php
          cmp web/public/editorial-reviews.php /tmp/newsroom-deployed-reviews.php
          cmp web/lib/db.php /tmp/newsroom-deployed-db.php
          cmp web/lib/content.php /tmp/newsroom-deployed-content.php
          echo "Production PHP files match the repair exactly."
          grep -n 'newsroom_latest_stories' /tmp/newsroom-deployed-index.php

      - name: Verify live homepage
        run: |
          python3 - <<'PYVERIFY'
          import time
          import subprocess
          for host in ['warehamtimes.com', 'www.warehamtimes.com']:
              for attempt in range(3):
                  url = 'https://' + host + '/?healthcheck=' + str(time.time_ns())
                  page = subprocess.check_output(['curl', '--fail', '--silent', '--show-error', '--location', '--max-time', '45', '-H', 'Cache-Control: no-cache', url], text=True)
                  print(host, attempt + 1, 'homepage received')
                  if 'Fatal error' in page or 'Uncaught PDOException' in page:
                      raise SystemExit('Homepage still contains a database fatal error: ' + page[:2000])
                  if 'The Wareham Times' not in page or 'Lead Story' not in page:
                      raise SystemExit('Homepage did not render expected content')
          print('Six uncached homepage checks passed across both domains.')
          PYVERIFY

      - name: Verify publisher access protection
        run: |
          code=$(curl --silent --show-error --max-time 45 -o /tmp/newsroom-review-login.html -w '%{http_code}' https://www.warehamtimes.com/editorial-reviews.php)
          test "$code" = 401
          grep -q 'Editorial Login' /tmp/newsroom-review-login.html
